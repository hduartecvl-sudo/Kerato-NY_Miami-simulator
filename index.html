<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keratopigmentation Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0b;
  --surface:#111113;
  --surface2:#1a1a1e;
  --border:#2a2a30;
  --text:#f0f0f0;
  --muted:#888;
  --accent:#c8a96e;
  --radius:10px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
#app{display:flex;height:100vh;width:100vw}
#sidebar{width:320px;min-width:320px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;z-index:10;transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);}
#main{flex:1;position:relative;overflow:hidden}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1),opacity 0.3s;z-index:1}

.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.logo{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:4px}
.title{font-size:18px;font-weight:300;color:var(--text)}
.tag{display:inline-block;padding:2px 8px;background:rgba(200,169,110,0.1);color:var(--accent);border-radius:4px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:500;margin-left:6px}

.section{padding:16px 20px;border-bottom:1px solid var(--border)}
.section-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:500}

.import-btn{width:100%;padding:12px;background:transparent;border:1px dashed var(--border);color:var(--muted);border-radius:var(--radius);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.import-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(200,169,110,0.05)}
.import-btn svg{width:16px;height:16px;flex-shrink:0}

.color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.color-dot{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all 0.2s;position:relative}
.color-dot:hover{transform:scale(1.1)}
.color-dot.active{border-color:white;box-shadow:0 0 0 1px rgba(255,255,255,0.3)}
.color-dot[title]:hover::after{content:attr(title);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#222;color:#fff;font-size:10px;padding:3px 7px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:100}
.group-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px;font-weight:500}

.intensity-row{display:flex;gap:6px}
.intensity-btn{flex:1;padding:8px 4px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;transition:all 0.2s;text-align:center}
.intensity-btn:hover{border-color:var(--accent);color:var(--accent)}
.intensity-btn.active{background:rgba(200,169,110,0.12);border-color:var(--accent);color:var(--accent)}

.slider-row{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.slider-row label{font-size:10px;color:var(--muted);width:64px;flex-shrink:0;white-space:nowrap}
.slider-row input[type=range]{width:120px;flex-shrink:0;accent-color:var(--accent)}
.slider-val{font-size:10px;font-family:'DM Mono',monospace;color:var(--accent);width:32px;text-align:right;flex-shrink:0}

.btn-row{display:flex;align-items:center;gap:4px;flex:1}
.step-btn{width:22px;height:22px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;font-family:'DM Sans',sans-serif;line-height:1}
.step-btn:hover{border-color:var(--accent);color:var(--accent)}

.save-btn{width:100%;padding:13px;background:var(--accent);border:none;color:#1a1200;border-radius:var(--radius);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.05em;transition:all 0.2s}
.save-btn:hover{background:#d9bc82;transform:translateY(-1px)}

.status{font-size:11px;color:var(--muted);text-align:center;padding:10px 20px;line-height:1.5}

.detecting-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:20}
.detecting-overlay.show{display:flex}
.spinner{width:38px;height:38px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cropPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.18)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.detecting-text{font-size:13px;color:var(--accent);letter-spacing:0.08em}

.placeholder{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.placeholder-icon{width:72px;height:72px;margin:0 auto 16px;opacity:0.15}
#instruction{position:absolute;top:16px;left:16px;background:rgba(200,169,110,0.15);border:1px solid rgba(200,169,110,0.5);color:#c8a96e;padding:8px 16px;border-radius:8px;font-size:12px;letter-spacing:0.04em;pointer-events:none;display:none;white-space:nowrap;z-index:10}
#sidebarToggle{position:fixed;top:50%;left:320px;transform:translateY(-50%);z-index:200;width:22px;height:56px;background:var(--surface);border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;transition:left 0.35s cubic-bezier(0.4,0,0.2,1);padding:0}
#sidebarToggle:hover{color:var(--accent);background:var(--surface2)}
#app.collapsed #sidebar{transform:translateX(-320px)}
#app.collapsed #sidebarToggle{left:0}
.placeholder-text{font-size:14px;color:var(--muted);line-height:1.8}

@media(max-width:640px){
  #app{flex-direction:column}
  #sidebar{width:100%;min-width:unset;height:auto;max-height:52vh;border-right:none;border-bottom:1px solid var(--border)}
  #main{flex:1}
}
#loginScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0b;z-index:9999;display:flex;align-items:center;justify-content:center}
#loginBox{width:320px;background:#111113;border:1px solid #2a2a30;border-radius:16px;padding:36px 32px}
#loginBox .logo{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:#c8a96e;font-weight:500;margin-bottom:6px}
#loginBox h1{font-size:22px;font-weight:300;color:#f0f0f0;margin-bottom:32px}
#loginBox input{width:100%;padding:11px 14px;background:#1a1a1e;border:1px solid #2a2a30;border-radius:10px;color:#f0f0f0;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;margin-bottom:12px;box-sizing:border-box;transition:border 0.2s}
#loginBox input:focus{border-color:#c8a96e}
#loginBtn{width:100%;padding:13px;background:#c8a96e;border:none;border-radius:10px;color:#1a1200;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;margin-top:4px}
#loginBtn:hover{background:#d9bc82}
#loginError{font-size:12px;color:#e24b4a;text-align:center;margin-top:12px;min-height:18px}
#loginPass::-ms-reveal{display:none}
#loginPass::-ms-clear{display:none}
#loginPass::-webkit-credentials-auto-fill-button{display:none}
</style>
</head>

const ALL_COLORS=[...BIOTIC];

// Groupes par ton de couleur
const BIOTIC_GROUPS=[
  {label:"Greens",indices:[0,1,2,3]},
  {label:"Greys",indices:[7,8]},
  {label:"Warm",indices:[5,6]},
  {label:"Blues",indices:[4]},
];

function buildColorList(){
  const list=document.getElementById("colorList");
  list.innerHTML="";

  function addGroup(label){
    const g=document.createElement("div");
    g.style.cssText="padding:6px 12px 3px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#666;font-weight:500";
    g.textContent=label;
    list.appendChild(g);
  }

  function addItem(colorObj,globalIdx){
    const item=document.createElement("div");
    item.style.cssText="padding:8px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background 0.15s;font-size:13px;color:var(--text)";
    item.onmouseover=()=>item.style.background="rgba(255,255,255,0.06)";
    item.onmouseout=()=>item.style.background="transparent";
    const dot=document.createElement("span");
    dot.style.cssText=`width:13px;height:13px;border-radius:50%;background:rgb(${colorObj.r},${colorObj.g},${colorObj.b});flex-shrink:0;border:1px solid rgba(255,255,255,0.15)`;
    const lbl=document.createElement("span");
    lbl.textContent=colorObj.name;
    item.appendChild(dot);
    item.appendChild(lbl);
    item.addEventListener("click",()=>selectColor(globalIdx));
    list.appendChild(item);
  }

  BIOTIC_GROUPS.forEach(g=>{
    addGroup(g.label);
    g.indices.forEach(i=>addItem(BIOTIC[i],i));
  });
}
buildColorList();

function selectColor(globalIdx){
  const c=ALL_COLORS[globalIdx];
  selColor=c;
  document.getElementById("colorDot").style.background=`rgb(${c.r},${c.g},${c.b})`;
  document.getElementById("colorLabel").textContent=c.name;
  document.getElementById("colorList").style.display="none";
  draw();
}

function toggleColorDropdown(){
  const list=document.getElementById("colorList");
  list.style.display=list.style.display==="none"?"block":"none";
}

document.addEventListener("click",function(e){
  if(!document.getElementById("colorDropdown").contains(e.target)){
    document.getElementById("colorList").style.display="none";
  }
});

const _accGroups=[
  {panel:"accPhoto",  arrow:"arrowPhoto"},
  {panel:"accPatient",arrow:"arrowPatient"},
  {panel:"accColour", arrow:"arrowColour"},
];
function _closeAllAcc(){
  _accGroups.forEach(g=>{
    const p=document.getElementById(g.panel);
    const a=document.getElementById(g.arrow);
    if(p) p.style.display="none";
    if(a) a.style.transform="rotate(-90deg)";
  });
}
function toggleAcc(id, arrowId){
  const el=document.getElementById(id);
  const ar=document.getElementById(arrowId);
  const open=el.style.display!=="none";
  _closeAllAcc();
  if(!open){
    el.style.display="block";
    ar.style.transform="rotate(0deg)";
  }
}
document.addEventListener("click",function(e){
  const sidebar=document.getElementById("sidebar");
  if(sidebar&&!sidebar.contains(e.target)){
    _closeAllAcc();
  }
});

// Accordéon Admin
document.getElementById("adminToggle").addEventListener("click",function(){
  const panel=document.getElementById("adminPanel");
  const arrow=document.getElementById("adminArrow");
  const open=panel.style.display==="none";
  panel.style.display=open?"block":"none";
  arrow.style.transform=open?"rotate(90deg)":"";
});

function animate(){
  irisSizeR+=(targetIrisSizeR-irisSizeR)*0.15;
  irisSizeL+=(targetIrisSizeL-irisSizeL)*0.15;
  if(Math.abs(irisSizeR-targetIrisSizeR)>0.01||Math.abs(irisSizeL-targetIrisSizeL)>0.01) draw();

}

function drawIris(iris, overrideSize, cuts, nasalDir, pupilOffset){
  const R=overrideSize!==undefined?overrideSize:irisSizeR;
  // Guard against NaN/Infinity which would crash createRadialGradient
  if(!isFinite(iris.x)||!isFinite(iris.y)||!isFinite(R)||R<=0) return;
  const uc=cuts?cuts.upper:upperCutR;
  const lc=cuts?cuts.lower:lowerCutR;
  const topRY = R * (1 - uc);
  const botRY = R * (1 - lc);
  const path = new Path2D();
  path.ellipse(iris.x, iris.y, R, topRY, 0, Math.PI, 0, false);
  path.ellipse(iris.x, iris.y, R, botRY, 0, 0, Math.PI, false);
  path.closePath();

  // Offscreen canvas pour iris + pupille transparente
  const off = document.createElement("canvas");
  off.width = canvas.width; off.height = canvas.height;
  const octx = off.getContext("2d");
  octx.save();
  octx.clip(path);

  // Apply saturation and brightness
  let {r,g,b}=selColor;
  r=Math.min(255,Math.round(r*irisBright));
  g=Math.min(255,Math.round(g*irisBright));
  b=Math.min(255,Math.round(b*irisBright));
  const grey=Math.round(0.299*r+0.587*g+0.114*b);
  r=Math.min(255,Math.round(grey+(r-grey)*irisSat));
  g=Math.min(255,Math.round(grey+(g-grey)*irisSat));
  b=Math.min(255,Math.round(grey+(b-grey)*irisSat));
  const grad=octx.createRadialGradient(iris.x,iris.y,R*0.18,iris.x,iris.y,R*1.05);
  grad.addColorStop(0,`rgba(${r},${g},${b},${Math.min(1,irisOpacity*fadingOpMult*0.6)})`);
  grad.addColorStop(0.45,`rgba(${r},${g},${b},${Math.min(1,irisOpacity*fadingOpMult*0.8)})`);
  grad.addColorStop(0.8,`rgba(${r},${g},${b},${Math.min(1,irisOpacity*fadingOpMult)})`);
  grad.addColorStop(1,`rgba(${Math.max(0,r-30)},${Math.max(0,g-30)},${Math.max(0,b-30)},${Math.min(1,irisOpacity*fadingOpMult)})`);
  octx.fillStyle=grad;
  octx.fill(path);

  octx.lineWidth=1.2;
  octx.strokeStyle=`rgba(${Math.max(0,r-60)},${Math.max(0,g-60)},${Math.max(0,b-60)},0.65)`;
  octx.stroke(path);
  octx.restore();

  // Pupille avec gradient
  const pupil=R*pupilSize;
  const nasalOffset=(nasalDir||0)*R*0.04;
  const po=pupilOffset||{x:0,y:0};
  const px=iris.x+nasalOffset+po.x*R;
  const py=iris.y+po.y*R;
  // Pupille transparente sur l'offscreen canvas
  octx.save();
  octx.globalCompositeOperation="destination-out";
  const pg=octx.createRadialGradient(px,py,0,px,py,pupil);
  pg.addColorStop(0,"rgba(0,0,0,1)");
  pg.addColorStop(0.8,"rgba(0,0,0,0.95)");
  pg.addColorStop(1,"rgba(0,0,0,0)");
  octx.beginPath();
  octx.arc(px,py,pupil,0,Math.PI*2);
  octx.fillStyle=pg;
  octx.fill();
  octx.restore();
  // Black overlay for opacity: 0=transparent, 1=black
  if(pupilOpacity>0){
    octx.save();
    octx.globalCompositeOperation="source-over";
    const bpg=octx.createRadialGradient(px,py,0,px,py,pupil);
    bpg.addColorStop(0,`rgba(0,0,0,${pupilOpacity})`);
    bpg.addColorStop(0.8,`rgba(0,0,0,${pupilOpacity*0.95})`);
    bpg.addColorStop(1,"rgba(0,0,0,0)");
    octx.beginPath();
    octx.arc(px,py,pupil,0,Math.PI*2);
    octx.fillStyle=bpg;
    octx.fill();
    octx.restore();
  }



  // Composite offscreen sur le canvas principal
  ctx.drawImage(off,0,0);
}



function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!imageLoaded) return;
  const scale=Math.min(canvas.width/img.width,canvas.height/img.height)*zoomFactor;
  const dw=img.width*scale;
  const dh=img.height*scale;
  const dx=(canvas.width-dw)/2;
  const dy=(canvas.height-dh)/2;
  // store for export (always without view zoom)
  window._drawDw=dw; window._drawDh=dh; window._drawDx=dx; window._drawDy=dy;
  // apply live view zoom/pan (display only)
  ctx.save();
  ctx.translate(canvas.width/2+viewPanX, canvas.height/2+viewPanY);
  ctx.scale(viewZoom, viewZoom);
  ctx.translate(-canvas.width/2, -canvas.height/2);
  ctx.drawImage(img,dx,dy,dw,dh);
  const displayScale=(dw/imgW);
  const scaledIrisR=irisSizeR*displayScale;
  const scaledIrisL=irisSizeL*displayScale;
  // irisRight = patient OD (right eye, left side of image)
  // irisLeft  = patient OS (left eye, right side of image)
  if(placementStep>=1){
    const r={x:dx+(irisRight.rx+posOffsetR.x)*dw, y:dy+(irisRight.ry+posOffsetR.y)*dh};
    drawIris(r, scaledIrisR, {upper:upperCutR, lower:lowerCutR}, 1, pupilOffsetR);
  }
  if(placementStep>=2){
    const l={x:dx+(irisLeft.rx+posOffsetL.x)*dw, y:dy+(irisLeft.ry+posOffsetL.y)*dh};
    drawIris(l, scaledIrisL, {upper:upperCutL, lower:lowerCutL}, -1, pupilOffsetL);
  }
  ctx.restore();
}

      imgW=img.naturalWidth*scale;
      imgH=img.naturalHeight*scale;
      imgX=(canvas.width-imgW)/2;
      imgY=(canvas.height-imgH)/2;

      setTimeout(()=>openCropModal(true), 80);

    };

  };
  reader.readAsDataURL(e.target.files[0]);
};

async function detectIrisWithClaude(base64Full){
  const overlay=document.getElementById("detectingOverlay");
  const apiKey=document.getElementById("apiKeyInput").value.trim();
  if(!apiKey){
    if(!cropAfterImport){
      showInstruction("Click on RIGHT pupil (OD)");
      placementStep=0;
    }
    return;
  }

  overlay.classList.add("show");
  

  const base64=base64Full.split(",")[1];
  const mediaType=base64Full.match(/data:([^;]+)/)[1];

  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:400,
        messages:[{
          role:"user",
          content:[
            {type:"image",source:{type:"base64",media_type:mediaType,data:base64}},
            {type:"text",text:`Analyze this portrait photo and detect the two irises (eyes).
The photo is displayed on a canvas of ${canvas.width}x${canvas.height}px.
The image is positioned at x=${Math.round(imgX)}, y=${Math.round(imgY)} with display dimensions ${Math.round(imgW)}x${Math.round(imgH)}px.
The original image size is ${img.width}x${img.height}px.

Return ONLY a valid JSON object, no extra text, no markdown:
{"left":{"x":<canvas_x>,"y":<canvas_y>,"r":<iris_radius_px>},"right":{"x":<canvas_x>,"y":<canvas_y>,"r":<iris_radius_px>}}

"left" = patient's left eye (appears on the RIGHT side of the image).
"right" = patient's right eye (appears on the LEFT side of the image).
x, y must be canvas pixel coordinates (account for image offset and scale factor).`}
          ]
        }]
      })
    });
    const data=await resp.json();
    const text=data.content.map(i=>i.text||"").join("");
    const clean=text.replace(/```json|```/g,"").trim();
    const result=JSON.parse(clean);

    const {dx,dy,dw,dh}=getImgCoords();
    irisLeft.rx=(result.left.x-dx)/dw;
    irisLeft.ry=(result.left.y-dy)/dh;
    irisRight.rx=(result.right.x-dx)/dw;
    irisRight.ry=(result.right.y-dy)/dh;

    const avgR=(result.left.r+result.right.r)/2;
    targetIrisSize=avgR;
    sizeSlider.value=avgR.toFixed(1);
    sizeVal.textContent=avgR.toFixed(1);

    placementStep=2;
    overlay.classList.remove("show");
    
    draw();
  } catch(err){
    overlay.classList.remove("show");
    
    placementStep=0;
    console.error("Detection error:", err);
  }
}

// Mouse events
function getImgCoords(){
  const scale=Math.min(canvas.width/img.width,canvas.height/img.height)*zoomFactor;
  const dw=img.width*scale, dh=img.height*scale;
  const dx=(canvas.width-dw)/2, dy=(canvas.height-dh)/2;
  return {dx,dy,dw,dh};
}
// Convert screen canvas coords → image-space, accounting for viewZoom/pan
function canvasToRel(mx,my){
  const cx=canvas.width/2, cy=canvas.height/2;
  const ux=(mx-cx-viewPanX)/viewZoom+cx;
  const uy=(my-cy-viewPanY)/viewZoom+cy;
  const {dx,dy,dw,dh}=getImgCoords();
  return {rx:(ux-dx)/dw, ry:(uy-dy)/dh};
}
// Convert relative iris coords → screen canvas coords, accounting for viewZoom/pan
function relToCanvas(iris){
  const {dx,dy,dw,dh}=getImgCoords();
  const cx=canvas.width/2, cy=canvas.height/2;
  const ix=dx+iris.rx*dw, iy=dy+iris.ry*dh;
  return {x:(ix-cx)*viewZoom+cx+viewPanX, y:(iy-cy)*viewZoom+cy+viewPanY};
}

// Clamp pan so photo doesn't wander too far off screen
function clampPan(){
  const {dw,dh}=getImgCoords();
  const maxPX=dw*(viewZoom-1)/2+dw*0.3;
  const maxPY=dh*(viewZoom-1)/2+dh*0.3;
  viewPanX=Math.max(-maxPX,Math.min(maxPX,viewPanX));
  viewPanY=Math.max(-maxPY,Math.min(maxPY,viewPanY));
}

canvas.addEventListener("mousedown",e=>{
  if(!imageLoaded) return;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  if(placementStep===0){const r=canvasToRel(mx,my);irisRight.rx=r.rx;irisRight.ry=r.ry;placementStep=1;draw();
    showInstruction("Now click on LEFT pupil (OS)");return;}
  if(placementStep===1){const r=canvasToRel(mx,my);irisLeft.rx=r.rx;irisLeft.ry=r.ry;placementStep=2;draw();
    showInstruction("");return;}
  const l=relToCanvas(irisLeft), ri=relToCanvas(irisRight);
  const {dw:dwD}=getImgCoords();
  const dsD=imgW>0?dwD/imgW:1;
  if(Math.hypot(mx-l.x,my-l.y)<irisSizeL*dsD*viewZoom+8) { dragging=irisLeft; return; }
  if(Math.hypot(mx-ri.x,my-ri.y)<irisSizeR*dsD*viewZoom+8) { dragging=irisRight; return; }
  // Start panning
  viewPanning=true;
  viewPanStartX=e.clientX-viewPanX;
  viewPanStartY=e.clientY-viewPanY;
  canvas.style.cursor="grabbing";
});
canvas.addEventListener("mousemove",e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  if(dragging){
    const r=canvasToRel(mx,my);
    dragging.rx=r.rx; dragging.ry=r.ry;
    draw(); return;
  }
  if(viewPanning){
    viewPanX=e.clientX-viewPanStartX;
    viewPanY=e.clientY-viewPanStartY;
    clampPan();
    draw();
  }
});
canvas.addEventListener("mouseup",()=>{
  dragging=null;
  viewPanning=false;
  canvas.style.cursor=viewZoom>1?"grab":"default";
});
canvas.addEventListener("mouseleave",()=>{
  dragging=null;
  viewPanning=false;
  canvas.style.cursor="default";
});

// Scroll-to-zoom
canvas.addEventListener("wheel",e=>{
  if(!imageLoaded) return;
  e.preventDefault();
  const delta=e.deltaY>0?0.9:1.1;
  viewZoom=Math.max(1,Math.min(5,viewZoom*delta));
  if(viewZoom===1){viewPanX=0;viewPanY=0;}
  else clampPan();
  canvas.style.cursor=viewZoom>1?"grab":"default";
  draw();
},{passive:false});

// Pinch-to-zoom (touch)
let lastTouchDist=null;
canvas.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    lastTouchDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY);
    e.preventDefault();
  }
},{passive:false});
canvas.addEventListener("touchmove",e=>{
  if(e.touches.length===2&&lastTouchDist!==null){
    const d=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY);
    viewZoom=Math.max(1,Math.min(5,viewZoom*(d/lastTouchDist)));
    lastTouchDist=d;
    if(viewZoom===1){viewPanX=0;viewPanY=0;}
    else clampPan();
    draw();
    e.preventDefault();
  }
},{passive:false});
canvas.addEventListener("touchend",()=>{lastTouchDist=null;});

// Zoom buttons
document.getElementById("zoomInBtn").addEventListener("click",()=>{
  if(!imageLoaded) return;
  viewZoom=Math.min(5,viewZoom*1.25);
  clampPan();
  canvas.style.cursor=viewZoom>1?"grab":"default";
  draw();
});
document.getElementById("zoomOutBtn").addEventListener("click",()=>{
  if(!imageLoaded) return;
  viewZoom=Math.max(1,viewZoom/1.25);
  if(viewZoom===1){viewPanX=0;viewPanY=0;}
  else clampPan();
  canvas.style.cursor=viewZoom>1?"grab":"default";
  draw();
});
document.getElementById("zoomResetBtn").addEventListener("click",()=>{
  viewZoom=1; viewPanX=0; viewPanY=0;
  canvas.style.cursor="default";
  if(imageLoaded) draw();
});

// Touch events (iPad/mobile)
canvas.addEventListener("touchstart",e=>{
  e.preventDefault();
  if(!imageLoaded) return;
  const rect=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const mx=t.clientX-rect.left, my=t.clientY-rect.top;
  if(placementStep===0){const r=canvasToRel(mx,my);irisRight.rx=r.rx;irisRight.ry=r.ry;placementStep=1;draw();
    showInstruction("Now click on LEFT pupil (OS)");return;}
  if(placementStep===1){const r=canvasToRel(mx,my);irisLeft.rx=r.rx;irisLeft.ry=r.ry;placementStep=2;draw();
    showInstruction("");return;}
  const l=relToCanvas(irisLeft), ri=relToCanvas(irisRight);
  const {dw:dwT}=getImgCoords();
  const dsT=imgW>0?dwT/imgW:1;
  if(Math.hypot(mx-l.x,my-l.y)<irisSizeL*dsT+14) dragging=irisLeft;
  else if(Math.hypot(mx-ri.x,my-ri.y)<irisSizeR*dsT+14) dragging=irisRight;
},{passive:false});
canvas.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(!dragging) return;
  const rect=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const mx=t.clientX-rect.left, my=t.clientY-rect.top;
  const r=canvasToRel(mx,my);
  dragging.rx=r.rx; dragging.ry=r.ry;
  draw();
},{passive:false});
canvas.addEventListener("touchend",()=>dragging=null);

// Save
document.getElementById("saveBtn").onclick=function(){
  const colorName=(document.getElementById("colorLabel").textContent||"iris").trim();
  const activeInt=document.querySelector(".intensity-btn.active");
  const intName=(activeInt?.textContent||"Medium").trim();

  const fadingLabels = ["J0","PO 1 month","PO 1 year"];
  const fadingLabel = fadingLabels[fadingIdx] || "J0";

  const lastName=(document.getElementById("patLastName").value||"").trim().toUpperCase().replace(/\s+/g,"_")||null;
  const firstName=(document.getElementById("patFirstName").value||"").trim().replace(/\s+/g,"_")||null;
  const dob=(document.getElementById("patDOB").value||"").trim()||null;
  const patSuffix=[lastName,firstName,dob].filter(Boolean).join("_");
  const baseFilename=[colorName,intName,fadingLabel,patSuffix].filter(Boolean).map(s=>s.replace(/\s+/g,"_")).join("_");

  // === EXTENDED CANVAS: banner ABOVE the photo (2x resolution) ===
  draw(); // ensure _draw* values are fresh
  const _pdx=window._drawDx!=null?window._drawDx:0;
  const _pdy=window._drawDy!=null?window._drawDy:0;
  const _pdw=window._drawDw!=null?window._drawDw:canvas.width;
  const _pdh=window._drawDh!=null?window._drawDh:canvas.height;
  const _sc=2; // retina 2x
  const bannerH = Math.round(_pdw * 0.10);
  const out=document.createElement("canvas");
  out.width=_pdw*_sc;
  out.height=(_pdh + bannerH)*_sc;
  const octx=out.getContext("2d");
  octx.scale(_sc,_sc);
  // Draw photo below the banner — crop source to exact photo area (no black bars)
  octx.drawImage(canvas, Math.round(_pdx), Math.round(_pdy), Math.round(_pdw), Math.round(_pdh), 0, bannerH, _pdw, _pdh);

  // Banner strip at top
  const bx=0, bw=_pdw, by=0;
  const fontSize=Math.round(bannerH*0.30);

  // Dark gradient background
  const cr=selColor?selColor.r:40;
  const cg=selColor?selColor.g:80;
  const cb=selColor?selColor.b:60;
  const grad=octx.createLinearGradient(bx,by,bx,by+bannerH);
  grad.addColorStop(0,`rgba(${cr},${cg},${cb},0.92)`);
  grad.addColorStop(1,`rgba(${Math.max(0,cr-30)},${Math.max(0,cg-30)},${Math.max(0,cb-30)},0.98)`);
  octx.fillStyle=grad;
  octx.fillRect(bx,by,bw,bannerH);
  // Bottom separator line (between banner and photo)
  octx.fillStyle="rgba(255,255,255,0.25)";
  octx.fillRect(bx,bannerH-2,bw,2);

  // === CIRCLE BADGE for logo (LEFT) ===
  const pad = bannerH * 0.12;
  const circleR = (bannerH - pad * 2) / 2;
  const circleCX = bx + pad + circleR;
  const circleCY = by + bannerH / 2;

  // White circle with glow
  octx.save();
  octx.shadowColor = "rgba(255,255,255,0.4)";
  octx.shadowBlur = circleR * 0.5;
  octx.beginPath();
  octx.arc(circleCX, circleCY, circleR, 0, Math.PI * 2);
  octx.fillStyle = "white";
  octx.fill();
  octx.restore();

  // Logo inside circle
  const logoImg = _logoImgGlobal;
  if(logoImg && logoImg.complete && logoImg.naturalWidth > 0){
    octx.save();
    octx.beginPath();
    octx.arc(circleCX, circleCY, circleR * 0.85, 0, Math.PI * 2);
    octx.clip();
    const innerPad = circleR * 0.12;
    const maxW = (circleR - innerPad) * 2;
    const maxH = (circleR - innerPad) * 2;
    const scale = Math.min(maxW / logoImg.naturalWidth, maxH / logoImg.naturalHeight);
    const lW = logoImg.naturalWidth * scale;
    const lH = logoImg.naturalHeight * scale;
    octx.drawImage(logoImg, circleCX - lW/2, circleCY - lH/2, lW, lH);
    octx.restore();
  }

  // Vertical divider
  const divX = bx + pad + circleR*2 + pad*0.8;
  octx.fillStyle="rgba(255,255,255,0.3)";
  octx.fillRect(divX, by + pad, 1.5, bannerH - pad*2);

  // Text in right zone — two lines for better readability
  const textX = divX + (bw - divX) / 2;
  const patText=[firstName,lastName].filter(Boolean).join(" ");
  const dobText=dob||"";
  // Line 1: color · intensity
  const line1=[colorName,intName].filter(Boolean).join("  ·  ");
  // Line 2: name · DOB
  const line2=[patText,dobText].filter(Boolean).join("  ·  ");
  const hasLine2 = line2.length > 0;

  octx.textBaseline="middle";
  octx.textAlign="center";
  if(hasLine2){
    const lineSpacing = bannerH * 0.30;
    octx.font=`700 ${Math.round(fontSize*1.1)}px 'Roboto','DM Sans',Arial,sans-serif`;
    octx.fillStyle="rgba(255,255,255,0.98)";
    octx.fillText(line1, textX, by + bannerH/2 - lineSpacing/2);
    octx.font=`400 ${Math.round(fontSize*0.82)}px 'Roboto','DM Sans',Arial,sans-serif`;
    octx.fillStyle="rgba(255,255,255,0.80)";
    octx.fillText(line2, textX, by + bannerH/2 + lineSpacing/2);
  } else {
    octx.font=`700 ${Math.round(fontSize*1.1)}px 'Roboto','DM Sans',Arial,sans-serif`;
    octx.fillStyle="rgba(255,255,255,0.98)";
    octx.fillText(line1, textX, by + bannerH/2);
  }

  const link = document.createElement("a");
  link.download = `${baseFilename}.png`;
  link.href = out.toDataURL("image/png");
  link.click();
};

// ── Google Drive Integration ──────────────────────────────────────────────
const GDRIVE_CLIENT_ID="533619215045-h078g6gl5rk473i69mcnjh2k0rdd22op.apps.googleusercontent.com";
const GDRIVE_SCOPES="https://www.googleapis.com/auth/drive.file";
let gapiReady=false,gisReady=false,driveTokenClient=null,driveAccessToken=null;

function loadGapiAndGis(cb){
  let gapiLoaded=false,gisLoaded=false;
  function check(){if(gapiLoaded&&gisLoaded)cb();}
  const s1=document.createElement("script");
  s1.src="https://apis.google.com/js/api.js";
  s1.onload=function(){gapi.load("client",function(){gapi.client.init({}).then(function(){gapiLoaded=true;check();});});};
  document.head.appendChild(s1);
  const s2=document.createElement("script");
  s2.src="https://accounts.google.com/gsi/client";
  s2.onload=function(){
    driveTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GDRIVE_CLIENT_ID,
      scope:GDRIVE_SCOPES,
      callback:""
    });
    gisLoaded=true;check();
  };
  document.head.appendChild(s2);
}

function getAccessToken(cb){
  if(driveAccessToken){cb(driveAccessToken);return;}
  driveTokenClient.callback=function(resp){
    if(resp.error){alert("Google Drive auth failed: "+resp.error);return;}
    driveAccessToken=resp.access_token;
    cb(driveAccessToken);
  };
  driveTokenClient.requestAccessToken({prompt:""});
}

function createDriveFolder(token,name,parentId,cb){
  const meta={name:name,mimeType:"application/vnd.google-apps.folder"};
  if(parentId)meta.parents=[parentId];
  fetch("https://www.googleapis.com/drive/v3/files",{
    method:"POST",
    headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
    body:JSON.stringify(meta)
  }).then(r=>r.json()).then(d=>cb(d.id));
}

function uploadFileToDrive(token,folderId,filename,blob,cb){
  const meta={name:filename,parents:[folderId]};
  const form=new FormData();
  form.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));
  form.append("file",blob);
  fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{
    method:"POST",
    headers:{"Authorization":"Bearer "+token},
    body:form
  }).then(r=>r.json()).then(d=>cb&&cb(d));
}

function exportToDrive(zipBlob,zipName,folderName){
  loadGapiAndGis(function(){
    getAccessToken(function(token){
      // Create patient folder
      createDriveFolder(token,folderName,null,function(folderId){
        uploadFileToDrive(token,folderId,zipName,zipBlob,function(){
          alert("✅ Upload terminé !\nDossier Drive : "+folderName);
        });
      });
    });
  });
}

// Crop modal
function openCropModal(afterImport){
  if(!imageLoaded && !afterImport){alert("Import a photo first.");return;}
  cropAfterImport=!!afterImport;
  cropZoom=1; cropPanX=0; cropPanY=0;
  const modal=document.getElementById("cropModal");
  modal.style.display="flex";
  drawCropPreview();
  const cc=document.getElementById("cropContainer");
  cc.onmousedown=function(e){cropDragging=true;cropStartX=e.clientX-cropPanX;cropStartY=e.clientY-cropPanY;e.preventDefault();};
  cc.onmousemove=function(e){if(!cropDragging)return;cropPanX=e.clientX-cropStartX;cropPanY=e.clientY-cropStartY;drawCropPreview();};
  cc.onmouseup=()=>cropDragging=false;
  cc.onmouseleave=()=>cropDragging=false;
  cc.ontouchstart=function(e){cropDragging=true;cropStartX=e.touches[0].clientX-cropPanX;cropStartY=e.touches[0].clientY-cropPanY;e.preventDefault();};
  cc.ontouchmove=function(e){if(!cropDragging)return;cropPanX=e.touches[0].clientX-cropStartX;cropPanY=e.touches[0].clientY-cropStartY;drawCropPreview();e.preventDefault();};
  cc.ontouchend=()=>cropDragging=false;
  cc.onwheel=function(e){cropZoom=Math.max(0.5,Math.min(5,cropZoom*(e.deltaY<0?1.1:0.91)));drawCropPreview();e.preventDefault();};
}
function closeCropModal(){
  document.getElementById("cropModal").style.display="none";
  if(cropAfterImport){
    cropAfterImport=false;
    placementStep=0;
    showInstruction("Click on RIGHT pupil (OD)");
  }
}
function drawCropPreview(){
  if(!img||!img.naturalWidth) return;
  const W=320,H=480;
  const cc=document.getElementById("cropCanvas");
  cc.width=W; cc.height=H;
  const ctx2=cc.getContext("2d");
  ctx2.clearRect(0,0,W,H);
  ctx2.fillStyle="#0a0a0b";
  ctx2.fillRect(0,0,W,H);
  // use Math.max so image always fills frame (no black bars at zoom=1)
  const scale=Math.max(W/img.naturalWidth,H/img.naturalHeight)*cropZoom;
  const iw=img.naturalWidth*scale, ih=img.naturalHeight*scale;
  const x=(W-iw)/2+cropPanX, y=(H-ih)/2+cropPanY;
  ctx2.drawImage(img,x,y,iw,ih);
}
function cropZoomIn(){cropZoom=Math.min(5,cropZoom*1.1);drawCropPreview();}
function cropZoomOut(){cropZoom=Math.max(0.2,cropZoom*0.91);drawCropPreview();}
function applyCrop(){
  const W=320,H=480;
  // base scale = fit image inside crop frame (zoom=1 means image fills frame with no black bars)
  const baseScale=Math.max(W/img.naturalWidth,H/img.naturalHeight);
  const scale=baseScale*cropZoom;
  const iw=img.naturalWidth*scale, ih=img.naturalHeight*scale;
  const x=(W-iw)/2+cropPanX, y=(H-ih)/2+cropPanY;
  const srcX=(-x)/scale, srcY=(-y)/scale;
  const srcW=W/scale, srcH=H/scale;
  // clamp so we don't read outside image bounds
  const clampedSrcX=Math.max(0,srcX), clampedSrcY=Math.max(0,srcY);
  const clampedSrcW=Math.min(srcW,img.naturalWidth-clampedSrcX);
  const clampedSrcH=Math.min(srcH,img.naturalHeight-clampedSrcY);
  const cropOff=document.createElement("canvas");
  cropOff.width=Math.round(clampedSrcW); cropOff.height=Math.round(clampedSrcH);
  cropOff.getContext("2d").drawImage(img,clampedSrcX,clampedSrcY,clampedSrcW,clampedSrcH,0,0,clampedSrcW,clampedSrcH);
  const newImg=new Image();
  newImg.onload=function(){
    img=newImg;
    const cW=canvas.width, cH=canvas.height;
    const scale2=Math.min(cW/img.width,cH/img.height)*0.92;
    imgW=img.width*scale2; imgH=img.height*scale2;
    imgX=(cW-imgW)/2; imgY=(cH-imgH)/2;
    // CHANGE 7: Preserve iris positions — only recalculate layout, do NOT reset irisRight/irisLeft
    draw();
    if(cropAfterImport){
      placementStep=0;
      showInstruction("Click on RIGHT pupil (OD)");
      cropAfterImport=false;
    }
  };
  newImg.src=cropOff.toDataURL("image/png");
  closeCropModal();
}
document.getElementById("cropBtn").addEventListener("click",openCropModal);

    <div style="display:flex;gap:10px">
      <button onclick="cropZoomOut()" style="padding:8px 16px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px">−</button>
      <button onclick="cropZoomIn()" style="padding:8px 16px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px">+</button>
      <button onclick="applyCrop()" style="padding:8px 24px;background:var(--accent);border:none;color:#1a1200;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500">Apply</button>
      <button onclick="closeCropModal()" style="padding:8px 16px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px">Cancel</button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <button onclick="cropPanY-=5;drawCropPreview()" style="padding:6px 14px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-size:15px">↑</button>
      <div style="display:flex;gap:4px">
        <button onclick="cropPanX-=5;drawCropPreview()" style="padding:6px 14px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-size:15px">←</button>
        <button onclick="cropPanY+=5;drawCropPreview()" style="padding:6px 14px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-size:15px">↓</button>
        <button onclick="cropPanX+=5;drawCropPreview()" style="padding:6px 14px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-size:15px">→</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
